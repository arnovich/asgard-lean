name: Lean verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lean-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Lean toolchain manager
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            --output "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned mathlib build cache
        run: lake exe cache get
      - name: Check libraries, examples and regression proofs
        run: lake build
      - name: Check degree-three mild table regression separately
        run: lake build Gimle.Asgard.Tests.MildDegreeThree
      # Replay authenticates compiled bytes, so an absolute checkout path (for
      # example in a linter log) would make otherwise identical builds differ.
      - name: Check compiled artifacts contain no checkout paths
        shell: bash
        run: |
          lib=.lake/build/lib/lean
          test -n "$(find "$lib" -name '*.olean' -print -quit)"
          if grep -rlF "$PWD" "$lib" --include='*.olean' --include='*.olean.server' \
              --include='*.olean.private' --include='*.ir'; then
            echo "checkout path embedded in the files above" >&2
            exit 1
          fi
