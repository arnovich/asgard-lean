name = "asgard"
version = "0.1.0"
# Temporary: Lean 4.33 changed the default of
# backward.isDefEq.respectTransparency.types to true, which breaks unification
# in about 30 files (Decidable instances, rw motives, simp). This restores
# the previous default package-wide; remove it in a follow-up that ports those
# proofs. It is passed as a raw -D argument because leanOptions treats the
# dotted name as a single quoted identifier.
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency.types=false"]
defaultTargets = ["Gimle.Asgard", "Gimle.Asgard.Examples", "Gimle.Asgard.Tests",
  "Gimle.Asgard.Examples.CircuitGallery", "diagram_demo"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Gimle.Asgard"

[[lean_lib]]
name = "Gimle.Asgard.Examples"

[[lean_lib]]
name = "Gimle.Asgard.Tests"

# Separate target, deliberately not imported by Gimle/Asgard/Examples.lean:
# it pulls in Visualization.Widget, the only ProofWidgets consumer.
# Keep this block AFTER Gimle.Asgard.Examples. Lake resolves an overlapping
# module name with findSomeRev? (reverse declaration order), so reordering
# these two would silently bind CircuitGallery to the parent library.
[[lean_lib]]
name = "Gimle.Asgard.Examples.CircuitGallery"

[[lean_exe]]
name = "diagram_demo"
root = "Executables.DiagramDemo"
